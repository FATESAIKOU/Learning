<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        padding: 3rem 4rem;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      }
      h1 {
        color: #333;
        font-size: 2.5rem;
        margin: 0 0 0.5rem 0;
      }
      p {
        color: #666;
        font-size: 1.1rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, World!</h1>
      <p>Deployed via Google Apps Script + clasp</p>
    </div>
  </body>
</html>
