<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #container {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      #title {
        position: absolute;
        font-family: system-ui, sans-serif;
        font-size: 96px;
        font-weight: 700;
        color: #ffffff;
        text-align: center;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="container">
        <h1
          id="title"
          class="clip"
          data-start="0"
          data-duration="5"
          data-track-index="0"
        >
          Hello, HyperFrames!
        </h1>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#title",
        { opacity: 0, y: 60, xPercent: -50, yPercent: -50 },
        { opacity: 1, y: 0, xPercent: -50, yPercent: -50, duration: 1.2 },
        0
      );
      tl.to(
        "#title",
        { opacity: 0, xPercent: -50, yPercent: -50, duration: 0.6 },
        4.4
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
